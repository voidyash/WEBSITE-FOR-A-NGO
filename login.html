      <title>Login Page</title>
    <style>
        /* CSS for the title */
        .center-title {
            text-align: center;
            color: #097c13;
            font-size: 25px; /* Change this value to adjust title size */
            margin: 15px;
        }
        /* CSS for the body */
        body {
            font-family: Arial, sans-serif;
        }
        /* CSS for the form container */
        .login-form {
            text-align: center;
            margin-top: 50px;
        }
        /* CSS for the labels */
        label {
            font-size: 38px; /* Change this value to adjust label size */
            color:rgb(78, 8, 23)
        }
        /* CSS for the input fields */
        input[type="text"], input[type="password"] {
            font-size: 16px; /* Change this value to adjust input text size */
            padding: 10px;
            margin: 5px;
            width: 400px;
        }
        /* CSS for the submit button */
        input[type="submit"] {
            font-size: 20px; /* Change this value to adjust button text size */
            padding: 10px 20px;
            margin: 5px;
            color: #099e22
        }
    </style>
    <script>
        function validateLogin() {
            var userId = document.getElementById("user_id").value;
            var password = document.getElementById("password").value;

            // Hardcoded user IDs and passwords
            var users = {
                "user1": "password1",
                "user2": "password2",
                "admin": "admin123"
            };

            // Check if the user ID exists and the password matches
            if (users[userId] && users[userId] === password) {
                alert("Login successful!");
                // Redirect to another page or perform some action
                return true;
            } else {
                alert("Invalid user ID or password");
                return false;
            }
        }
    </script>
</head>
<body>
    <h2 class="center-title">Login Page</h2>
    <div class="login-form">
        <form onsubmit="return validateLogin()">
            <label for="user_id">User ID:</label><br>
            <input type="text" id="user_id" name="user_id" required><br><br>
            
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>
            
            <input type="submit" value="Login">
        </form>
    </div>

</body>
